<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page { margin:0 }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:627px}
body{font:16px/1.5 -apple-system,"Helvetica Neue",Inter,Arial,sans-serif;background:#ffffff;color:#16202e;
  display:flex;flex-direction:column;position:relative;overflow:hidden}
.bar{height:10px;background:linear-gradient(90deg,#2f5d94 0%,#2f5d94 62%,#eb6834 62%,#eb6834 100%)}
.body{flex:1;padding:56px 68px 0;display:flex;flex-direction:column}
.kicker{font-size:17px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;color:#2f5d94;margin-bottom:26px}
h1{font-family:"Iowan Old Style",Charter,Caladea,"Palatino Linotype",Palatino,Georgia,serif;font-weight:600;
  font-size:84px;line-height:1.08;letter-spacing:-.015em;max-width:1010px}
.sub{margin-top:26px;font-size:30px;color:#5a6577;line-height:1.42;max-width:930px}
.stats{margin-top:auto;display:flex;gap:0;border-top:1px solid #e2e7ef}
.stat{padding:26px 44px 30px 0;margin-right:44px;border-right:1px solid #e2e7ef}
.stat:last-child{border-right:none}
.n{font-family:"Iowan Old Style",Charter,Caladea,Palatino,Georgia,serif;font-size:40px;line-height:1;color:#16202e}
.l{font-size:16px;color:#5a6577;margin-top:9px;letter-spacing:.02em}
.foot{background:#f7f9fc;border-top:1px solid #e2e7ef;padding:20px 68px;display:flex;
  justify-content:space-between;align-items:center;font-size:18px;color:#5a6577}
.foot b{color:#16202e;font-weight:600}
.url{font-family:ui-monospace,Menlo,"DejaVu Sans Mono",monospace;font-size:16px;color:#2f5d94}
</style></head><body>
<div class="bar"></div>
<div class="body">
  <div class="kicker">A library of interactive Python guides</div>
  <h1>Python, Visually</h1>
  <div class="sub">Learn Python by running it.<br>Every guide is a set of Colab notebooks.</div>
  <div class="stats">
    <div class="stat"><div class="n">8</div><div class="l">parts in every notebook</div></div>
    <div class="stat"><div class="n">0</div><div class="l">things to install</div></div>
    <div class="stat"><div class="n">Free</div><div class="l">notebooks under CC BY 4.0</div></div>
  </div>
</div>
<div class="foot"><span>By <b>John Fisher</b></span>
<span class="url">johnfisher-ai.github.io/Python-Visual-Guides</span></div>
</body></html>
